global:
  scrape_interval: 15s # How frequently to scrape targets by default.
  evaluation_interval: 15s # How frequently to evaluate rules.

scrape_configs:
  - job_name: 'backend'
    # Metrics endpoint of the backend service.
    # 'backend' is the service name defined in docker-compose.yml,
    # and 3001 is the port it exposes within the Docker network.
    static_configs:
      - targets: ['backend:3001']
    # metrics_path defaults to /metrics
    # scheme defaults to http

  # Example: If you had a node-exporter running on the backend container or elsewhere
  # - job_name: 'node_exporter'
  #   static_configs:
  #     - targets: ['backend:9100'] # Assuming node_exporter runs on port 9100 on the backend service

  # Prometheus itself can be a target if you want to monitor it.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
